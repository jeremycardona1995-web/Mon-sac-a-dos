<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mon sac à dos</title>

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d0f14">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mon sac à dos">

    <style>
        :root {
            --fond: #0d0f14;
            --surface: #171a21;
            --surface-2: #1f242e;
            --bordure: #272c36;
            --bordure-fine: #21262f;
            --texte: #e8ecf1;
            --attenue: #8b93a1;
            --vert: #22c55e;
            --vert-fonce: #15a34a;
            --ambre: #f59e0b;
            --rouge: #ef4444;
        }

        * { box-sizing: border-box; }

        html { background: var(--fond); }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--fond);
            color: var(--texte);
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
        }

        .appli { max-width: 560px; margin: 0 auto; padding: 0 16px; }
        .appli > main { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }

        /* ---------- Entête ---------- */
        .entete-haut {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 0 16px;
        }
        .entete-haut h1 {
            font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin: 0;
        }
        .ico-btn {
            width: 40px; height: 40px; border-radius: 12px; flex: none;
            background: var(--surface); border: 1px solid var(--bordure);
            color: var(--texte); font-size: 19px; line-height: 1; cursor: pointer;
        }

        .hero {
            background: linear-gradient(150deg, #16233a, #121722);
            border: 1px solid var(--bordure);
            border-radius: 22px; padding: 18px;
            display: flex; align-items: center; gap: 18px;
        }
        .anneau { position: relative; width: 80px; height: 80px; flex: none; }
        .anneau .valeur {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .anneau .valeur b { font-size: 21px; font-weight: 800; line-height: 1; }
        .anneau .valeur small { font-size: 9.5px; color: var(--attenue); letter-spacing: 0.7px; margin-top: 3px; }
        .hero-txt { min-width: 0; }
        .hero-txt strong { display: block; font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
        .hero-txt p { margin: 6px 0 0; font-size: 13px; color: var(--attenue); line-height: 1.5; }
        .hero-txt .poids-sac { color: var(--vert); font-weight: 600; font-size: 13px; }

        /* ---------- Barre collante ---------- */
        .collant {
            position: sticky; top: 0; z-index: 30;
            margin: 0 -16px; padding: 14px 16px 12px;
            background: rgba(13, 15, 20, 0.93);
            -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
        }
        .recherche {
            width: 100%; padding: 12px 14px; font-size: 15px;
            background: var(--surface); color: var(--texte);
            border: 1px solid var(--bordure); border-radius: 13px;
            font-family: inherit; -webkit-appearance: none;
        }
        .recherche::placeholder { color: var(--attenue); }
        .recherche:focus { outline: none; border-color: var(--vert); }

        .segments {
            display: flex; gap: 4px; margin-top: 10px; padding: 4px;
            background: #14181f; border: 1px solid var(--bordure); border-radius: 13px;
        }
        .segments button {
            flex: 1; padding: 9px 2px; font-size: 12.5px; font-weight: 600;
            background: none; border: none; color: var(--attenue);
            border-radius: 10px; cursor: pointer; font-family: inherit;
            white-space: nowrap;
        }
        .segments button.actif { background: var(--surface-2); color: #fff; }

        /* ---------- Groupes et lignes ---------- */
        .groupe { margin-top: 22px; }
        .groupe-titre {
            display: flex; align-items: center; gap: 9px;
            margin: 0 2px 10px; cursor: pointer;
        }
        .groupe-titre span { font-size: 14px; font-weight: 700; }
        .groupe-titre em {
            font-style: normal; font-size: 11px; color: var(--attenue);
            background: var(--surface); border: 1px solid var(--bordure);
            padding: 2px 8px; border-radius: 99px;
        }

        .carte {
            background: var(--surface); border: 1px solid var(--bordure);
            border-radius: 16px; overflow: hidden;
        }
        .ligne-hote { position: relative; overflow: hidden; }
        .ligne {
            display: flex; align-items: center; gap: 12px;
            padding: 13px 14px; min-height: 52px;
            border-bottom: 1px solid var(--bordure-fine);
            background: var(--surface); position: relative; z-index: 1;
            touch-action: pan-y; cursor: grab;
        }

        /* Fond révélé pendant le glissement */
        .fond-glisse {
            position: absolute; inset: 0; display: flex; align-items: center;
            padding: 0 20px; font-size: 11.5px; font-weight: 800;
            letter-spacing: 0.6px; opacity: 0; pointer-events: none;
        }
        .fond-glisse.droite { justify-content: flex-start; }
        .fond-glisse.gauche { justify-content: flex-end; }
        .fond-glisse.c-vert   { background: rgba(34, 197, 94, 0.18);  color: var(--vert); }
        .fond-glisse.c-ambre  { background: rgba(245, 158, 11, 0.18); color: var(--ambre); }
        .fond-glisse.c-neutre { background: rgba(139, 147, 161, 0.15); color: var(--attenue); }
        .ligne-hote:last-child .ligne { border-bottom: none; }
        .ligne:active { background: var(--surface-2); }

        .puce {
            width: 23px; height: 23px; border-radius: 50%; flex: none;
            border: 2px solid #3a414e; position: relative;
        }
        .ligne.a-prendre .puce { border-color: var(--ambre); background: rgba(245, 158, 11, 0.16); }
        .ligne.range .puce { background: var(--vert); border-color: var(--vert); }
        .ligne.range .puce::after {
            content: ""; position: absolute; left: 6.5px; top: 3px;
            width: 5px; height: 10px; border: solid var(--fond);
            border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
        }

        .nom { flex: 1; font-size: 15.5px; font-weight: 500; min-width: 0; }
        .ligne.range .nom { color: var(--attenue); }
        .etiq {
            font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
            padding: 3px 8px; border-radius: 6px; flex: none;
            background: rgba(245, 158, 11, 0.16); color: var(--ambre);
        }
        .poids { font-size: 12px; color: var(--attenue); flex: none; font-variant-numeric: tabular-nums; }

        .vide { text-align: center; color: var(--attenue); font-size: 14px; padding: 46px 20px; line-height: 1.6; }

        /* ---------- Bouton flottant ---------- */
        .fab {
            width: 58px; height: 58px; border-radius: 50%; border: none;
            background: linear-gradient(145deg, var(--vert), var(--vert-fonce));
            color: #062b13; font-size: 32px; font-weight: 300; cursor: pointer;
            box-shadow: 0 10px 26px rgba(34, 197, 94, 0.42);
        }

        /* ---------- Feuilles ---------- */
        .voile {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: rgba(0, 0, 0, 0.62);
            -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
            justify-content: center; align-items: flex-end;
        }
        .voile.ouvert { display: flex; }
        .feuille {
            background: var(--surface); width: 100%; max-width: 560px;
            border-radius: 24px 24px 0 0; border: 1px solid var(--bordure); border-bottom: none;
            padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
            max-height: 88vh; overflow-y: auto;
        }
        .poignee { width: 42px; height: 4px; border-radius: 99px; background: #39404d; margin: 4px auto 14px; }
        .feuille-titre {
            text-align: center; font-size: 13px; font-weight: 600;
            color: var(--attenue); margin-bottom: 14px; word-break: break-word;
        }
        .act {
            display: block; width: 100%; padding: 15px; margin-bottom: 8px;
            background: var(--surface-2); border: 1px solid var(--bordure);
            border-radius: 13px; font-size: 16px; font-weight: 600;
            color: var(--texte); cursor: pointer; font-family: inherit; text-align: center;
        }
        .act.danger { color: var(--rouge); }
        .act.annuler { background: none; border-color: transparent; color: var(--attenue); margin-top: 4px; }

        .feuille label {
            display: block; margin: 16px 0 6px 2px;
            font-size: 12px; font-weight: 700; color: var(--attenue);
            letter-spacing: 0.5px; text-transform: uppercase;
        }
        .feuille input, .feuille select {
            width: 100%; padding: 13px 14px; font-size: 15px; font-family: inherit;
            background: var(--surface-2); color: var(--texte);
            border: 1px solid var(--bordure); border-radius: 12px; -webkit-appearance: none;
        }
        .feuille input:focus, .feuille select:focus { outline: none; border-color: var(--vert); }
        .principal {
            background: linear-gradient(145deg, var(--vert), var(--vert-fonce));
            color: #062b13; border: none; margin-top: 14px;
        }
        .separateur { height: 1px; background: var(--bordure); margin: 24px 0 4px; }

        /* ---------- Tutoriel ---------- */
        .voile-tuto {
            display: none; position: fixed; inset: 0; z-index: 200;
            background: rgba(0, 0, 0, 0.74);
            -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
            align-items: center; justify-content: center;
            padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
        }
        .voile-tuto.ouvert { display: flex; }

        /* La carte ne dépasse jamais l'écran : le contenu défile, le bouton
           reste visible en bas quelle que soit la hauteur du téléphone. */
        .tuto-carte {
            background: var(--surface); border: 1px solid var(--bordure);
            border-radius: 24px; width: 100%; max-width: 420px;
            max-height: 100%; overflow: hidden;
            display: flex; flex-direction: column;
            padding: 22px 18px 16px;
        }
        .tuto-entete { flex: none; }
        .tuto-corps {
            flex: 1 1 auto; min-height: 0; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -18px; padding: 0 18px;
        }
        .tuto-pied { flex: none; padding-top: 10px; position: relative; }
        /* Dégradé qui signale qu'il reste du contenu sous la ligne de flottaison. */
        .tuto-carte.defilable .tuto-pied::before {
            content: ""; position: absolute; left: 0; right: 0; bottom: 100%;
            height: 28px; pointer-events: none;
            background: linear-gradient(to top, var(--surface), rgba(23, 26, 33, 0));
        }
        .tuto-pied .act { margin-bottom: 0; }

        .tuto-carte h2 { font-size: 21px; font-weight: 800; text-align: center; margin: 0 0 5px; }
        .tuto-intro { text-align: center; font-size: 13px; color: var(--attenue); margin: 0 0 11px; }
        .etape { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; }
        .etape .sym {
            width: 44px; height: 44px; border-radius: 13px; flex: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 700;
            background: var(--surface-2); border: 1px solid var(--bordure);
        }
        .etape .sym.v { background: rgba(34,197,94,.16); border-color: rgba(34,197,94,.45); color: var(--vert); }
        .etape .sym.am { background: rgba(245,158,11,.16); border-color: rgba(245,158,11,.45); color: var(--ambre); }
        .etape strong { display: block; font-size: 15px; margin-bottom: 3px; }
        .etape p { margin: 0; font-size: 13px; color: var(--attenue); line-height: 1.5; }
        .tuto-note {
            font-size: 12.5px; color: var(--attenue); line-height: 1.55;
            background: var(--surface-2); border: 1px solid var(--bordure);
            border-radius: 12px; padding: 12px 14px; margin: 2px 0 2px;
        }

        /* Téléphones courts : on resserre plutôt que de forcer le défilement. */
        @media (max-height: 730px) {
            .tuto-carte { padding: 18px 16px 14px; border-radius: 20px; }
            .tuto-carte h2 { font-size: 18.5px; }
            .tuto-intro { font-size: 12px; margin-bottom: 15px; }
            .etape { margin-bottom: 13px; gap: 12px; }
            .etape .sym { width: 38px; height: 38px; border-radius: 11px; font-size: 17px; }
            .etape strong { font-size: 14px; margin-bottom: 2px; }
            .etape p { font-size: 12.5px; line-height: 1.45; }
            .tuto-note { font-size: 11.5px; padding: 10px 12px; }
            .tuto-pied .act { padding: 13px; font-size: 15px; }
        }

        .toast {
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 200;
            background: var(--surface-2); border: 1px solid var(--bordure);
            color: var(--texte); font-size: 14px; font-weight: 600;
            padding: 12px 20px; border-radius: 99px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
            opacity: 0; pointer-events: none; transition: opacity .22s ease;
            max-width: 88vw; text-align: center;
        }
        .toast.visible { opacity: 1; }

        /* ---------- Émojis Twemoji ---------- */
        .emj {
            height: 1.15em; width: 1.15em; vertical-align: -0.2em;
            margin: 0 0.04em; display: inline-block;
        }

        /* ---------- Vue Nourriture ---------- */
        .hero-food { display: block; }
        .food-total { font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
        .food-total small { font-size: 15px; color: var(--attenue); font-weight: 600; margin-left: 5px; }
        .food-auto { font-size: 13.5px; font-weight: 700; color: var(--vert); margin-top: 7px; }
        .food-auto.court { color: var(--ambre); }
        .food-det { font-size: 12.5px; color: var(--attenue); margin-top: 9px; line-height: 1.5; }

        .densite { margin-top: 13px; }
        .densite .echelle {
            height: 8px; border-radius: 99px; position: relative;
            background: linear-gradient(90deg, #ef4444 0%, #f59e0b 34%, #22c55e 62%, #22c55e 100%);
        }
        .densite .curseur {
            position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px;
            background: #fff; box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45);
            transition: left .35s ease;
        }
        .densite .legende {
            display: flex; justify-content: space-between; font-size: 9.5px;
            color: var(--attenue); margin-top: 6px; letter-spacing: 0.3px;
        }

        .reglages { display: flex; gap: 10px; margin: 14px 0 4px; }
        .reglage {
            flex: 1; background: var(--surface); border: 1px solid var(--bordure);
            border-radius: 14px; padding: 10px 12px;
        }
        .reglage > span {
            display: block; font-size: 10px; color: var(--attenue); letter-spacing: 0.6px;
            text-transform: uppercase; font-weight: 700; margin-bottom: 6px;
        }
        .reglage .valeur { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .reglage b { font-size: 17px; font-weight: 800; }
        .reglage i { font-style: normal; font-size: 11px; color: var(--attenue); display: block; margin-top: 2px; }
        .reglage .pm { display: flex; gap: 5px; flex: none; }
        .reglage .pm button {
            width: 30px; height: 30px; border-radius: 9px; background: var(--surface-2);
            border: 1px solid var(--bordure); color: var(--texte); font-size: 16px;
            cursor: pointer; font-family: inherit; padding: 0;
        }

        .avertissement {
            background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 12px; padding: 11px 13px; font-size: 12px;
            color: var(--ambre); line-height: 1.5; margin-top: 14px;
        }

        .ligne-food { cursor: pointer; }
        .qte {
            font-size: 12px; font-weight: 800; color: var(--attenue);
            min-width: 26px; flex: none; font-variant-numeric: tabular-nums;
        }
        .nom-food { flex: 1; min-width: 0; }
        .nom-food b { display: block; font-size: 14.5px; font-weight: 500; }
        .nom-food i { display: block; font-style: normal; font-size: 11px; color: var(--attenue); margin-top: 2px; }
        .bilan-food { text-align: right; flex: none; }
        .bilan-food b { display: block; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .bilan-food i { display: block; font-style: normal; font-size: 10px; font-weight: 600; margin-top: 2px; }
        .bilan-food i.d-haute { color: var(--vert); }
        .bilan-food i.d-moyenne { color: var(--ambre); }
        .bilan-food i.d-basse { color: var(--rouge); }

        /* ---------- Boutons flottants empilés ---------- */
        .fabs {
            position: fixed; right: 20px; z-index: 40;
            bottom: calc(24px + env(safe-area-inset-bottom));
            display: flex; flex-direction: column; gap: 12px; align-items: center;
        }
        .fab-vue {
            width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--bordure);
            background: var(--surface-2); font-size: 21px; cursor: pointer; padding: 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            display: flex; align-items: center; justify-content: center;
        }
        .fab-vue .emj { height: 24px; width: 24px; vertical-align: 0; margin: 0; }

        /* ---------- Sélecteur d'aliments et d'émojis ---------- */
        .resultats { max-height: 46vh; overflow-y: auto; margin: 0 -18px; padding: 0 18px; }
        .prop {
            display: flex; align-items: center; gap: 11px; width: 100%;
            padding: 11px 13px; margin-bottom: 6px; text-align: left;
            background: var(--surface-2); border: 1px solid var(--bordure);
            border-radius: 12px; color: var(--texte); font-family: inherit; cursor: pointer;
        }
        .prop .lib { flex: 1; font-size: 14.5px; font-weight: 500; min-width: 0; }
        .prop .dens { font-size: 11px; font-weight: 700; color: var(--attenue); flex: none; }

        .grille-emoji {
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
            margin-bottom: 14px;
        }
        .grille-emoji button {
            aspect-ratio: 1; border-radius: 10px; background: var(--surface-2);
            border: 1px solid var(--bordure); cursor: pointer; padding: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .grille-emoji button .emj { height: 22px; width: 22px; vertical-align: 0; margin: 0; }
        .titre-theme {
            font-size: 10.5px; font-weight: 700; color: var(--attenue);
            letter-spacing: 0.8px; text-transform: uppercase; margin: 14px 0 8px 2px;
        }

        .courses { font-size: 13.5px; line-height: 1.7; }
        .courses h4 { font-size: 12px; color: var(--attenue); letter-spacing: .6px;
                      text-transform: uppercase; margin: 14px 0 6px; }
        .courses div { display: flex; justify-content: space-between; gap: 10px; }
        .courses div span:last-child { color: var(--attenue); flex: none; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>

<div class="appli">
    <header>
        <div class="entete-haut">
            <h1>Mon sac à dos</h1>
            <button class="ico-btn" id="btn-menu" aria-label="Menu">⋯</button>
        </div>

        <div class="hero" id="hero-sac">
            <div class="anneau">
                <svg width="80" height="80" viewBox="0 0 80 80">
                    <circle cx="40" cy="40" r="34" fill="none" stroke="#1e2839" stroke-width="8"></circle>
                    <circle id="arc" cx="40" cy="40" r="34" fill="none" stroke="#22c55e" stroke-width="8"
                            stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"
                            transform="rotate(-90 40 40)" style="transition: stroke-dashoffset .45s ease"></circle>
                </svg>
                <div class="valeur"><b id="pourcent">0%</b><small>PRÊT</small></div>
            </div>
            <div class="hero-txt">
                <strong id="hero-titre">Bonne rando !</strong>
                <p id="hero-detail"></p>
            </div>
        </div>

        <div class="collant" id="barre-sac">
            <input type="search" class="recherche" id="recherche" placeholder="Rechercher un équipement…" autocomplete="off">
            <div class="segments" id="segments">
                <button data-f="tout" class="actif">Tout</button>
                <button data-f="a-prendre">À prendre</button>
                <button data-f="range">Rangé</button>
                <button data-f="reserve">Réserve</button>
            </div>
        </div>
        <div id="entete-food" hidden></div>
    </header>

    <main id="liste"></main>
</div>

<div class="fabs">
    <button class="fab-vue" id="btn-vue" aria-label="Changer de vue"></button>
    <button class="fab" id="fab" aria-label="Ajouter">+</button>
</div>

<div class="voile" id="voile">
    <div class="feuille" id="feuille">
        <div class="poignee"></div>
        <div class="feuille-titre" id="feuille-titre"></div>
        <div id="feuille-corps"></div>
    </div>
</div>

<div class="voile-tuto" id="tuto">
    <div class="tuto-carte">
        <div class="tuto-entete">
            <h2 id="tuto-titre"></h2>
            <p class="tuto-intro" id="tuto-intro"></p>
        </div>
        <div class="tuto-corps" id="tuto-corps"></div>
        <div class="tuto-pied">
            <button class="act principal" id="tuto-ok">C’est parti !</button>
        </div>
    </div>
</div>

<input type="file" id="fichier-import" accept="application/json,.json" style="display:none">
<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   Mon sac à dos — données
   ========================================================================== */

const categoriesParDefaut = {
    "🏠 Abri et couchage": ["🏕️ Tente", "🛌️ Sac de couchage", "🛏️ Tapis de sol", "🛏️ Sac à viande", "🛏️ Appui tête", "🌟 Bâche"],
    "🍽️ Cuisine et nourriture": ["🏺 Réchaud à gaz + cartouche", "🍴 Éponge et liquide vaisselle", "🍵 Mug / gobelet", "🍴 Couverts", "🍲 Popote", "🍲 Nourriture", "🌾 Barre de céréale", "💧 Filtre à eau + 2L d'eau", "💧 2 grandes gourdes"],
    "🔦 Éclairage et sécurité": ["🔦 Lampe frontale", "🔦 Lampe portative", "🔋 Piles/batterie", "📢 Sifflet de survie", "🔪 Couteau multifonction", "🧭 Boussole / GPS"],
    "🧼 Vêtements et protection": ["🧥 Veste imperméable", "🧣 Bonnet et gants", "👕 Vêtements de rechange", "👕 Vêtements chauds (soir)", "👖 Pantalon léger / short", "👖 Pantalon long", "👟 Chaussures de rando", "🧤 Lunettes de soleil", "☀️ Crème solaire", "🧢 Casquette"],
    "🧼 Produits d'hygiène et secours": ["🧽 Serviette microfibre", "🚿 Gel douche", "🦷 Brosse à dents", "🦷 Dentifrice", "🧴Désinfectant mains", "🧻 Papier toilette", "🧺 Sac poubelle", "💊 Trousse de secours"]
};

/* Les deux premières clés sont celles des versions précédentes : l'inventaire
   personnalisé et les coches existantes sont donc repris tels quels.
   « poidsTrekV3 » est nouvelle et démarre vide. */
let categories = lire('structTrekV3', categoriesParDefaut);
let etats      = lire('stateTrekV3', {});
let poids      = lire('poidsTrekV3', {});
let vivres     = lire('vivresTrekV1', {});
let reglages   = lire('reglagesTrekV1', { jours: 3, kcalJour: 3000 });
let vue        = 'sac';

/* Les versions precedentes nommaient les etats « missing » et « present ».
   On les convertit une fois pour toutes, et on ecarte toute valeur inconnue,
   afin que les coches deja posees soient reprises sans perte. */
(function migrerEtats() {
    const correspondance = { missing: 'a-prendre', present: 'range' };
    const valides = ['a-prendre', 'range'];
    let modifie = false;
    for (const objet in etats) {
        const valeur = etats[objet];
        if (correspondance[valeur]) { etats[objet] = correspondance[valeur]; modifie = true; }
        else if (valides.indexOf(valeur) === -1) { delete etats[objet]; modifie = true; }
    }
    if (modifie) sauver();
})();

function lire(cle, defaut) {
    try {
        const brut = localStorage.getItem(cle);
        return brut ? JSON.parse(brut) : JSON.parse(JSON.stringify(defaut));
    } catch (e) {
        return JSON.parse(JSON.stringify(defaut));
    }
}

function sauver() {
    localStorage.setItem('structTrekV3', JSON.stringify(categories));
    localStorage.setItem('stateTrekV3', JSON.stringify(etats));
    localStorage.setItem('poidsTrekV3', JSON.stringify(poids));
    localStorage.setItem('vivresTrekV1', JSON.stringify(vivres));
    localStorage.setItem('reglagesTrekV1', JSON.stringify(reglages));
}

/* ==========================================================================
   Utilitaires
   ========================================================================== */

let filtre = 'tout';
let recherche = '';

const sansAccent = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function formaterPoids(grammes) {
    if (!grammes) return '';
    if (grammes >= 1000) {
        const kg = grammes / 1000;
        return (Math.round(kg * 10) / 10).toString().replace('.', ',') + ' kg';
    }
    return grammes + ' g';
}

function vibrer(duree) {
    if (navigator.vibrate) { try { navigator.vibrate(duree); } catch (e) {} }
}

let minuteurToast = null;
function toast(message) {
    const t = document.getElementById('toast');
    t.textContent = message;
    t.classList.add('visible');
    clearTimeout(minuteurToast);
    minuteurToast = setTimeout(() => t.classList.remove('visible'), 2600);
}

/* ==========================================================================
   Appui long — remplace oncontextmenu, qui ne fonctionne pas sur iPhone
   ========================================================================== */

function appuiLong(element, rappel) {
    let minuteur = null;
    let declenche = false;

    const demarrer = () => {
        declenche = false;
        minuteur = setTimeout(() => {
            minuteur = null;
            declenche = true;
            vibrer(18);
            rappel();
        }, 480);
    };
    const annuler = () => { clearTimeout(minuteur); minuteur = null; };

    element.addEventListener('touchstart', demarrer, { passive: true });
    element.addEventListener('touchmove', annuler, { passive: true });
    element.addEventListener('touchcancel', annuler, { passive: true });
    element.addEventListener('touchend', e => {
        annuler();
        /* L'appui long a déjà agi : on empêche le clic simulé qui suivrait. */
        if (declenche) e.preventDefault();
    });

    /* Clic droit sur ordinateur. Le garde-fou d'ouverture évite le doublon
       sur Android, où l'appui long déclenche aussi contextmenu. */
    element.addEventListener('contextmenu', e => { e.preventDefault(); rappel(); });
}

/* ==========================================================================
   Feuilles d'action
   ========================================================================== */

const voile = document.getElementById('voile');

function ouvrirFeuille(titre, construire) {
    if (voile.classList.contains('ouvert')) return;   /* garde-fou anti-doublon */
    document.getElementById('feuille-titre').textContent = titre;
    const corps = document.getElementById('feuille-corps');
    corps.innerHTML = '';
    construire(corps);
    voile.classList.add('ouvert');
    majEmojis();
}

function fermerFeuille() { voile.classList.remove('ouvert'); }

voile.addEventListener('click', e => { if (e.target === voile) fermerFeuille(); });

function bouton(parent, libelle, classe, action) {
    const b = document.createElement('button');
    b.className = 'act ' + (classe || '');
    b.textContent = libelle;
    b.onclick = action;
    parent.appendChild(b);
    return b;
}

/* ==========================================================================
   Affichage
   ========================================================================== */

function etatDe(objet) { return etats[objet] || 'reserve'; }

function visible(objet, groupe) {
    /* Une recherche qui vise un groupe (« cuisine ») affiche tout son contenu. */
    if (recherche) {
        const dansObjet = sansAccent(objet).includes(recherche);
        const dansGroupe = sansAccent(groupe).includes(recherche);
        if (!dansObjet && !dansGroupe) return false;
    }
    if (filtre === 'tout') return true;
    return etatDe(objet) === filtre;
}

function afficher() {
    if (vue === 'food') { afficherVivres(); return; }

    const liste = document.getElementById('liste');
    liste.innerHTML = '';

    let aPrendre = 0, ranges = 0, poidsSac = 0, poidsRestant = 0, affiches = 0;

    for (const groupe in categories) {
        const objets = categories[groupe];

        objets.forEach(objet => {
            const etat = etatDe(objet);
            const g = poids[objet] || 0;
            if (etat === 'range') { ranges++; poidsSac += g; }
            else if (etat === 'a-prendre') { aPrendre++; poidsRestant += g; }
        });

        const retenus = objets.filter(o => visible(o, groupe));
        if (retenus.length === 0) continue;
        affiches += retenus.length;

        const bloc = document.createElement('div');
        bloc.className = 'groupe';

        const titre = document.createElement('div');
        titre.className = 'groupe-titre';
        const nomGroupe = document.createElement('span');
        nomGroupe.textContent = groupe;
        const compteur = document.createElement('em');
        compteur.textContent = objets.filter(o => etatDe(o) === 'range').length + '/' + objets.length;
        titre.appendChild(nomGroupe);
        titre.appendChild(compteur);
        appuiLong(titre, () => menuGroupe(groupe));
        bloc.appendChild(titre);

        const carte = document.createElement('div');
        carte.className = 'carte';

        retenus.forEach(objet => {
            const etat = etatDe(objet);
            const ligne = document.createElement('div');
            ligne.className = 'ligne ' + etat;

            const puce = document.createElement('div');
            puce.className = 'puce';
            ligne.appendChild(puce);

            const nom = document.createElement('div');
            nom.className = 'nom';
            nom.textContent = objet;
            ligne.appendChild(nom);

            if (etat === 'a-prendre') {
                const etiq = document.createElement('div');
                etiq.className = 'etiq';
                etiq.textContent = 'À PRENDRE';
                ligne.appendChild(etiq);
            }

            if (poids[objet]) {
                const p = document.createElement('div');
                p.className = 'poids';
                p.textContent = formaterPoids(poids[objet]);
                ligne.appendChild(p);
            }

            /* L'appui simple ne fait rien : c'est le glissement qui range. */
            appuiLong(ligne, () => menuObjet(objet, groupe));

            const hote = document.createElement('div');
            hote.className = 'ligne-hote';
            const fond = document.createElement('div');
            fond.className = 'fond-glisse';
            hote.appendChild(fond);
            hote.appendChild(ligne);
            rendreGlissable(ligne, fond,
                droite => {
                    const c = etatVoisin(etatDe(objet), droite);
                    return c ? { texte: LIBELLE_ETAT[c], couleur: COULEUR_ETAT[c] } : null;
                },
                droite => {
                    const c = etatVoisin(etatDe(objet), droite);
                    if (!c) return false;
                    vibrer(c === 'range' ? [10, 40, 14] : 12);
                    definirEtat(objet, c);
                    return true;
                });
            carte.appendChild(hote);
        });

        bloc.appendChild(carte);
        liste.appendChild(bloc);
    }

    if (affiches === 0) {
        const vide = document.createElement('div');
        vide.className = 'vide';
        vide.textContent = recherche
            ? 'Aucun équipement ne correspond à cette recherche.'
            : 'Rien dans cette catégorie pour le moment.';
        liste.appendChild(vide);
    }

    majHero(aPrendre, ranges, poidsSac, poidsRestant);
    majEmojis();
}

function majHero(aPrendre, ranges, poidsSac, poidsRestant) {
    const selectionnes = aPrendre + ranges;
    const ratio = selectionnes ? ranges / selectionnes : 0;

    const CIRCONFERENCE = 213.6;
    document.getElementById('arc').setAttribute('stroke-dashoffset', CIRCONFERENCE * (1 - ratio));
    document.getElementById('pourcent').textContent = Math.round(ratio * 100) + '%';

    const titre = document.getElementById('hero-titre');
    const detail = document.getElementById('hero-detail');

    if (selectionnes === 0) {
        titre.textContent = 'Prépare ta rando';
        detail.innerHTML = 'Touche un équipement pour l\'ajouter à ta liste.';
        return;
    }

    titre.textContent = ranges === selectionnes ? 'Sac bouclé !' : 'Bonne rando !';

    let texte = ranges + ' rangé' + (ranges > 1 ? 's' : '') +
                ' sur ' + selectionnes + '<br>' +
                (aPrendre === 0 ? 'Plus rien à trouver' : aPrendre + ' encore à trouver');

    if (poidsSac || poidsRestant) {
        texte += '<br><span class="poids-sac">Sac : ' + (formaterPoids(poidsSac) || '0 g');
        if (poidsRestant) texte += ' (+' + formaterPoids(poidsRestant) + ')';
        texte += '</span>';
    }
    detail.innerHTML = texte;
}

/* ==========================================================================
   Actions sur les objets
   ========================================================================== */

function definirEtat(objet, etat) {
    if (etat === 'reserve') delete etats[objet];
    else etats[objet] = etat;
    sauver();
    afficher();
}

/* Glissement latéral. L'objet avance ou recule d'un cran selon la section où
   il se trouve : Réserve → À prendre → Rangé vers la droite, et l'inverse vers
   la gauche. Au bout de la chaîne, la ligne résiste et ne bouge pas.
   Fonctionne au doigt comme à la souris. */
const SEUIL_GLISSEMENT = 68;
const ORDRE_ETATS = ['reserve', 'a-prendre', 'range'];
const LIBELLE_ETAT = { reserve: 'RÉSERVE', 'a-prendre': 'À PRENDRE', range: '✓  RANGÉ' };
const COULEUR_ETAT = { reserve: 'c-neutre', 'a-prendre': 'c-ambre', range: 'c-vert' };

/* Renvoie la section voisine, ou null s'il n'y en a pas dans cette direction. */
function etatVoisin(etat, versLaDroite) {
    const i = ORDRE_ETATS.indexOf(etat) + (versLaDroite ? 1 : -1);
    return (i < 0 || i >= ORDRE_ETATS.length) ? null : ORDRE_ETATS[i];
}

function rendreGlissable(ligne, fond, apercu, valider) {
    let departX = 0, departY = 0, ecart = 0;
    let actif = false, horizontal = false;

    function commencer(x, y) {
        departX = x; departY = y; ecart = 0;
        actif = true; horizontal = false;
        ligne.style.transition = 'none';
    }

    function deplacer(x, y) {
        if (!actif) return;
        const ex = x - departX, ey = y - departY;

        if (!horizontal) {
            if (Math.abs(ex) < 9 && Math.abs(ey) < 9) return;
            /* Geste plutôt vertical : on rend la main au défilement. */
            if (Math.abs(ex) <= Math.abs(ey)) { actif = false; return; }
            horizontal = true;
        }

        ecart = ex;
        const versLaDroite = ecart > 0;
        const vu = apercu(versLaDroite);

        /* Sans destination possible, la ligne résiste au lieu de suivre le doigt. */
        ligne.style.transform = 'translateX(' + (ecart * (vu ? 0.85 : 0.22)) + 'px)';

        if (!vu) { fond.style.opacity = 0; return; }
        fond.className = 'fond-glisse ' + (versLaDroite ? 'droite' : 'gauche') + ' ' + vu.couleur;
        fond.textContent = vu.texte;
        fond.style.opacity = Math.min(1, Math.abs(ecart) / SEUIL_GLISSEMENT);
    }

    function terminer() {
        if (!actif) return;
        actif = false;
        ligne.style.transition = 'transform .2s ease';
        ligne.style.transform = '';

        if (horizontal && Math.abs(ecart) >= SEUIL_GLISSEMENT && valider(ecart > 0)) return;
        fond.style.opacity = 0;
    }

    ligne.addEventListener('touchstart', e => {
        commencer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    ligne.addEventListener('touchmove', e => {
        deplacer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    ligne.addEventListener('touchend', terminer);
    ligne.addEventListener('touchcancel', terminer);

    ligne.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        e.preventDefault();
        commencer(e.clientX, e.clientY);

        const surDeplacement = ev => deplacer(ev.clientX, ev.clientY);
        const surRelachement = () => {
            document.removeEventListener('mousemove', surDeplacement);
            document.removeEventListener('mouseup', surRelachement);
            terminer();
        };
        document.addEventListener('mousemove', surDeplacement);
        document.addEventListener('mouseup', surRelachement);
    });
}

function menuObjet(objet, groupe) {
    ouvrirFeuille(objet, corps => {
        bouton(corps, '✏️ Renommer', '', () => {
            fermerFeuille();
            const nouveau = prompt('Nouveau nom :', objet);
            if (!nouveau || !nouveau.trim() || nouveau.trim() === objet) return;
            const nom = nouveau.trim();
            const i = categories[groupe].indexOf(objet);
            if (i !== -1) categories[groupe][i] = nom;
            if (etats[objet]) { etats[nom] = etats[objet]; delete etats[objet]; }
            if (poids[objet]) { poids[nom] = poids[objet]; delete poids[objet]; }
            sauver(); afficher();
        });

        bouton(corps, '⚖️ ' + (poids[objet] ? 'Modifier le poids (' + formaterPoids(poids[objet]) + ')' : 'Indiquer le poids'), '', () => {
            fermerFeuille();
            const saisie = prompt('Poids en grammes (laisser vide pour retirer) :', poids[objet] || '');
            if (saisie === null) return;
            const valeur = parseInt(saisie.replace(',', '.'), 10);
            if (!saisie.trim() || isNaN(valeur) || valeur <= 0) delete poids[objet];
            else poids[objet] = valeur;
            sauver(); afficher();
        });

        bouton(corps, '🗑️ Supprimer', 'danger', () => {
            fermerFeuille();
            if (!confirm('Supprimer « ' + objet + ' » ?')) return;
            categories[groupe] = categories[groupe].filter(o => o !== objet);
            delete etats[objet];
            delete poids[objet];
            sauver(); afficher();
        });

        bouton(corps, 'Annuler', 'annuler', fermerFeuille);
    });
}

function menuGroupe(groupe) {
    ouvrirFeuille(groupe, corps => {
        bouton(corps, '✏️ Renommer le groupe', '', () => {
            fermerFeuille();
            const nouveau = prompt('Nouveau nom du groupe :', groupe);
            if (!nouveau || !nouveau.trim() || nouveau.trim() === groupe) return;
            const nom = nouveau.trim();
            if (categories[nom]) { toast('Ce groupe existe déjà'); return; }
            const remplace = {};
            for (const cle in categories) remplace[cle === groupe ? nom : cle] = categories[cle];
            categories = remplace;
            sauver(); afficher();
        });

        bouton(corps, '🗑️ Supprimer le groupe', 'danger', () => {
            fermerFeuille();
            if (!confirm('Supprimer « ' + groupe +' » et tout son contenu ?')) return;
            categories[groupe].forEach(o => { delete etats[o]; delete poids[o]; });
            delete categories[groupe];
            sauver(); afficher();
        });

        bouton(corps, 'Annuler', 'annuler', fermerFeuille);
    });
}

/* ==========================================================================
   Ajout de matériel
   ========================================================================== */

function ajouterMateriel(etat) {
    etat = etat || { objet: '', groupe: null, poids: '', nouveauGroupe: '' };
    fermerFeuille();
    ouvrirFeuille('Ajouter du matériel', corps => {
        corps.innerHTML =
            '<label for="f-objet">Nouvel équipement</label>' +
            '<input type="text" id="f-objet" placeholder="🧗 Corde 50 m">' +
            '<label for="f-groupe">Dans quel groupe ?</label>' +
            '<select id="f-groupe"></select>' +
            '<label for="f-poids">Poids en grammes (facultatif)</label>' +
            '<input type="number" id="f-poids" inputmode="numeric" placeholder="1200">';

        const select = corps.querySelector('#f-groupe');
        for (const groupe in categories) {
            const opt = document.createElement('option');
            opt.value = groupe; opt.textContent = groupe;
            select.appendChild(opt);
        }

        const champObjet = corps.querySelector('#f-objet');
        const champPoids = corps.querySelector('#f-poids');
        champObjet.value = etat.objet;
        champPoids.value = etat.poids;
        if (etat.groupe && categories[etat.groupe]) select.value = etat.groupe;

        /* Mémorise la saisie avant d'ouvrir le sélecteur, puis rouvre la
           feuille pré-remplie : rien n'est perdu au passage. */
        function memoriser() {
            return {
                objet: champObjet.value, groupe: select.value,
                poids: champPoids.value,
                nouveauGroupe: bloc.querySelector('#f-nouveau-groupe').value
            };
        }

        function prefixer(texte, emoji) {
            const sansSymbole = texte.replace(/^\S+\s+/, function (debut) {
                return /[\u0000-\u00ff]/.test(debut.trim()[0]) ? debut : '';
            });
            return (emoji + ' ' + sansSymbole).trim();
        }

        bouton(corps, '😀 Choisir un symbole', '', () => {
            const enCours = memoriser();
            choisirEmoji(emoji => {
                enCours.objet = prefixer(enCours.objet, emoji);
                ajouterMateriel(enCours);
            }, () => ajouterMateriel(enCours));
        });

        bouton(corps, 'Ajouter à la liste', 'principal', () => {
            const nom = champObjet.value.trim();
            const groupe = select.value;
            const p = parseInt(champPoids.value, 10);
            if (!nom) { toast('Donne un nom à l\'équipement'); return; }
            if (!groupe) { toast('Crée d\'abord un groupe'); return; }
            if (categories[groupe].includes(nom)) { toast('Cet équipement existe déjà'); return; }
            categories[groupe].push(nom);
            if (!isNaN(p) && p > 0) poids[nom] = p;
            sauver(); afficher(); fermerFeuille();
            toast('« ' + nom + ' » ajouté');
        });

        const sep = document.createElement('div');
        sep.className = 'separateur';
        corps.appendChild(sep);

        const bloc = document.createElement('div');
        bloc.innerHTML =
            '<label for="f-nouveau-groupe">Nouveau groupe</label>' +
            '<input type="text" id="f-nouveau-groupe" placeholder="🧗 Escalade">';
        corps.appendChild(bloc);
        bloc.querySelector('#f-nouveau-groupe').value = etat.nouveauGroupe;

        bouton(corps, '😀 Symbole du groupe', '', () => {
            const enCours = memoriser();
            choisirEmoji(emoji => {
                enCours.nouveauGroupe = prefixer(enCours.nouveauGroupe, emoji);
                ajouterMateriel(enCours);
            }, () => ajouterMateriel(enCours));
        });

        bouton(corps, 'Créer le groupe', '', () => {
            const nom = bloc.querySelector('#f-nouveau-groupe').value.trim();
            if (!nom) { toast('Donne un nom au groupe'); return; }
            if (categories[nom]) { toast('Ce groupe existe déjà'); return; }
            categories[nom] = [];
            sauver(); afficher(); fermerFeuille();
            toast('Groupe « ' + nom + ' » créé');
        });

        bouton(corps, 'Annuler', 'annuler', fermerFeuille);
    });
}

document.getElementById('fab').onclick = () => {

};

/* ==========================================================================
   Export / import
   ========================================================================== */

function exporter() {
    const donnees = {
        application: 'Mon sac à dos',
        version: 1,
        date: new Date().toISOString(),
        categories: categories,
        etats: etats,
        poids: poids
    };
    const blob = new Blob([JSON.stringify(donnees, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mon-sac-a-dos-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Liste exportée');
}

document.getElementById('fichier-import').onchange = function () {
    const fichier = this.files && this.files[0];
    this.value = '';
    if (!fichier) return;

    const lecteur = new FileReader();
    lecteur.onload = e => {
        let donnees;
        try {
            donnees = JSON.parse(e.target.result);
        } catch (err) {
            toast('Fichier illisible');
            return;
        }
        if (!donnees || typeof donnees.categories !== 'object' || Array.isArray(donnees.categories)) {
            toast('Ce fichier n\'est pas une liste valide');
            return;
        }
        const nb = Object.values(donnees.categories).reduce((t, v) => t + (Array.isArray(v) ? v.length : 0), 0);
        if (!confirm('Importer ' + nb + ' équipements ?\n\nTa liste actuelle sera remplacée.')) return;

        categories = donnees.categories;
        etats = (donnees.etats && typeof donnees.etats === 'object') ? donnees.etats : {};
        poids = (donnees.poids && typeof donnees.poids === 'object') ? donnees.poids : {};
        sauver(); afficher();
        toast('Liste importée');
    };
    lecteur.readAsText(fichier);
};

/* Remplace, dans tous les nœuds texte, les émojis connus par leur image.
   Si un fichier manque, le caractère d'origine est remis en place. */
function fragmentEmoji(texte) {
    const frag = document.createDocumentFragment();
    let i = 0, tampon = '', trouve = false;

    while (i < texte.length) {
        let fichier = null, taille = 0;
        for (let l = 3; l >= 1; l--) {
            const bout = texte.substr(i, l);
            if (EMOJIS[bout]) { fichier = EMOJIS[bout]; taille = l; break; }
        }
        if (!fichier) { tampon += texte[i]; i++; continue; }

        if (tampon) { frag.appendChild(document.createTextNode(tampon)); tampon = ''; }
        const img = document.createElement('img');
        img.className = 'emj';
        img.src = 'emoji/' + fichier + '.svg';
        img.alt = texte.substr(i, taille);
        img.onerror = function () {
            if (this.parentNode) this.parentNode.replaceChild(document.createTextNode(this.alt), this);
        };
        frag.appendChild(img);
        i += taille;
        trouve = true;
    }

    if (!trouve) return null;
    if (tampon) frag.appendChild(document.createTextNode(tampon));
    return frag;
}

function majEmojis() {
    const parcours = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    const cibles = [];
    let n;
    while ((n = parcours.nextNode())) {
        if (n.nodeValue && /[^\u0000-\u00ff]/.test(n.nodeValue)) cibles.push(n);
    }
    cibles.forEach(noeud => {
        const frag = fragmentEmoji(noeud.nodeValue);
        if (frag && noeud.parentNode) noeud.parentNode.replaceChild(frag, noeud);
    });
}

const MOMENTS = [
    { cle: 'petit-dej', nom: '☕ Petits-déjeuners' },
    { cle: 'midi',      nom: '🥪 Midis' },
    { cle: 'soir',      nom: '🍲 Soirs' },
    { cle: 'encas',     nom: '🍫 En-cas' }
];

const DENSITE_HAUTE = 440;   /* kcal/100 g : menu dense, sac léger */
const DENSITE_BASSE = 320;   /* en dessous, on porte surtout de l'eau */

function nomMoment(cle) {
    const m = MOMENTS.filter(x => x.cle === cle)[0];
    return m ? m.nom : cle;
}

function formaterMasse(grammes) {
    if (grammes >= 1000) {
        return (Math.round(grammes / 10) / 100).toString().replace('.', ',') + ' kg';
    }
    return Math.round(grammes) + ' g';
}

function formaterEntier(n) {
    return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
}

function classeDensite(d) {
    if (d >= DENSITE_HAUTE) return 'd-haute';
    if (d >= DENSITE_BASSE) return 'd-moyenne';
    return 'd-basse';
}

function bilanVivres() {
    let kcal = 0, masse = 0, articles = 0;
    MOMENTS.forEach(m => (vivres[m.cle] || []).forEach(a => {
        kcal += a.k * a.q;
        masse += a.p * a.q;
        articles += a.q;
    }));
    return {
        kcal: kcal, masse: masse, articles: articles,
        besoin: reglages.jours * reglages.kcalJour,
        densite: masse ? (kcal / masse) * 100 : 0,
        autonomie: reglages.kcalJour ? kcal / reglages.kcalJour : 0,
        parJour: reglages.jours ? masse / reglages.jours : 0
    };
}

function afficherVivres() {
    const liste = document.getElementById('liste');
    liste.innerHTML = '';
    majEnteteVivres(bilanVivres());

    let total = 0;
    MOMENTS.forEach(moment => {
        const articles = vivres[moment.cle] || [];
        if (!articles.length) return;
        total += articles.length;

        const bloc = document.createElement('div');
        bloc.className = 'groupe';

        const titre = document.createElement('div');
        titre.className = 'groupe-titre';
        const nom = document.createElement('span');
        nom.textContent = moment.nom;
        const compte = document.createElement('em');
        const kcalMoment = articles.reduce((t, a) => t + a.k * a.q, 0);
        compte.textContent = formaterEntier(kcalMoment) + ' kcal';
        titre.appendChild(nom);
        titre.appendChild(compte);
        bloc.appendChild(titre);

        const carte = document.createElement('div');
        carte.className = 'carte';

        articles.forEach((article, index) => {
            const ligne = document.createElement('div');
            ligne.className = 'ligne ligne-food';

            const qte = document.createElement('div');
            qte.className = 'qte';
            qte.textContent = '×' + article.q;
            ligne.appendChild(qte);

            const nomBloc = document.createElement('div');
            nomBloc.className = 'nom-food';
            const b = document.createElement('b');
            b.textContent = article.n;
            const i = document.createElement('i');
            i.textContent = formaterMasse(article.p) + ' l\u2019unité · ' + formaterEntier(article.k) + ' kcal';
            nomBloc.appendChild(b);
            nomBloc.appendChild(i);
            ligne.appendChild(nomBloc);

            const densite = article.p ? (article.k / article.p) * 100 : 0;
            const bilan = document.createElement('div');
            bilan.className = 'bilan-food';
            const tot = document.createElement('b');
            tot.textContent = formaterEntier(article.k * article.q);
            const dd = document.createElement('i');
            dd.className = classeDensite(densite);
            dd.textContent = Math.round(densite) + '/100g';
            bilan.appendChild(tot);
            bilan.appendChild(dd);
            ligne.appendChild(bilan);

            appuiLong(ligne, () => menuAliment(moment.cle, index));

            const hote = document.createElement('div');
            hote.className = 'ligne-hote';
            const fond = document.createElement('div');
            fond.className = 'fond-glisse';
            hote.appendChild(fond);
            hote.appendChild(ligne);

            rendreGlissable(hote.lastChild, fond,
                droite => droite ? { texte: '+ 1', couleur: 'c-vert' }
                                 : (article.q > 1 ? { texte: '− 1', couleur: 'c-ambre' } : null),
                droite => {
                    if (!droite && article.q <= 1) return false;
                    article.q += droite ? 1 : -1;
                    vibrer(12);
                    sauver(); afficher();
                    return true;
                });

            carte.appendChild(hote);
        });

        bloc.appendChild(carte);
        liste.appendChild(bloc);
    });

    if (!total) {
        const vide = document.createElement('div');
        vide.className = 'vide';
        vide.textContent = 'Aucun aliment pour l\u2019instant.\nTouche le + pour composer tes repas.';
        vide.style.whiteSpace = 'pre-line';
        liste.appendChild(vide);
    }

    majEmojis();
}

    let phrase;
    if (!b.kcal) phrase = 'Commence par ajouter tes repas.';
    else if (manque > 0) phrase = 'Il te manque <b>' + formaterEntier(manque) + ' kcal</b> pour boucler ' + reglages.jours + ' jours';
    else phrase = 'Tu as <b>' + formaterEntier(-manque) + ' kcal</b> d\u2019avance';

    let alertes = '';
    if (reglages.jours > 7) {
        const kilos = formaterMasse(reglages.jours * 800);
        alertes += '<div class="avertissement">⚠️ <b>' + reglages.jours + ' jours de vivres, c\u2019est environ ' +
                   kilos + ' à porter.</b> Découpe ta traversée en sections entre deux ravitaillements et ' +
                   'planifie une section à la fois — 5 à 7 jours au maximum.</div>';
    }
    if (b.masse && b.densite < DENSITE_BASSE) {
        alertes += '<div class="avertissement">⚠️ <b>' + Math.round(b.densite) + ' kcal/100 g, c\u2019est peu dense.</b> ' +
                   'Tu portes surtout de l\u2019eau. Vise 440 en remplaçant le frais et les conserves par du sec et du gras.</div>';
    }

    zone.innerHTML =
        '<div class="hero hero-food">' +
            '<div class="food-total">' + formaterEntier(b.kcal) + '<small>kcal</small></div>' +
            '<div class="food-auto' + (autonomieCourte ? ' court' : '') + '">' +
                (Math.round(b.autonomie * 10) / 10).toString().replace('.', ',') +
                ' jour' + (b.autonomie >= 2 ? 's' : '') + ' d\u2019autonomie' +
                (autonomieCourte ? ' sur ' + reglages.jours : '') +
            '</div>' +
            '<div class="food-det">' + formaterMasse(b.masse) + ' de vivres · ' +
                formaterMasse(b.parJour) + ' par jour<br>' + phrase + '</div>' +
            '<div class="densite">' +
                '<div class="echelle"><div class="curseur" style="left:' + position + '%"></div></div>' +
                '<div class="legende"><span>LOURD</span><span>' + Math.round(b.densite) +
                ' kcal/100 g</span><span>ULTRALÉGER</span></div>' +
            '</div>' +
        '</div>' +
        '<div class="reglages">' +
            reglageHTML('jours', 'Durée', reglages.jours + ' j',
                        reglages.jours >= 7 ? '≈ ' + (Math.round(reglages.jours / 7 * 10) / 10).toString().replace('.', ',') + ' sem.' : 'jours de marche') +
            reglageHTML('kcal', 'Besoin / jour', formaterEntier(reglages.kcalJour), 'kcal') +
        '</div>' + alertes;

    zone.querySelectorAll('button[data-reg]').forEach(btn => {
        btn.onclick = () => {
            const pas = parseInt(btn.dataset.pas, 10);
            if (btn.dataset.reg === 'jours') {
                reglages.jours = Math.max(1, Math.min(60, reglages.jours + pas));
            } else {
                reglages.kcalJour = Math.max(1500, Math.min(6000, reglages.kcalJour + pas * 100));
            }
            sauver(); afficher();
        };
    });
}

function reglageHTML(cle, etiquette, valeur, sous) {
    return '<div class="reglage"><span>' + etiquette + '</span><div class="valeur">' +
           '<div><b>' + valeur + '</b><i>' + sous + '</i></div>' +
           '<div class="pm">' +
             '<button data-reg="' + cle + '" data-pas="-1">−</button>' +
             '<button data-reg="' + cle + '" data-pas="1">+</button>' +
           '</div></div></div>';
}

/* ---------------------------------------------------------------- Ajout */

function ajouterAliment() {
    ouvrirFeuille('Ajouter un aliment', corps => {
        corps.innerHTML = '<input type="search" class="recherche" id="f-cherche" ' +
                          'placeholder="Chercher : pâtes, chocolat, huile…" autocomplete="off">' +
                          '<div class="resultats" id="f-resultats"></div>';

        const champ = corps.querySelector('#f-cherche');
        const zone = corps.querySelector('#f-resultats');

        function proposer() {
            const q = sansAccent(champ.value.trim());
            zone.innerHTML = '';
            const trouves = BIBLIOTHEQUE
                .filter(a => !q || sansAccent(a.n).includes(q))
                .sort((x, y) => {
                    if (!q) return 0;
                    /* Ce qui commence par la recherche passe devant : taper
                       « huile » doit proposer l'huile avant les sardines. */
                    const dx = sansAccent(x.n).indexOf(q);
                    const dy = sansAccent(y.n).indexOf(q);
                    return dx !== dy ? dx - dy : x.n.localeCompare(y.n, 'fr');
                });

            trouves.slice(0, 40).forEach(a => {
                const b = document.createElement('button');
                b.className = 'prop';
                b.innerHTML = '<span class="lib">' + a.e + ' ' + a.n + '</span>' +
                              '<span class="dens">' + a.d + '/100g</span>';
                b.onclick = () => detailAliment({
                    n: a.e + ' ' + a.n,
                    p: a.p,
                    k: Math.round(a.d * a.p / 100),
                    q: 1
                }, a.m, null);
                zone.appendChild(b);
            });

            const libre = document.createElement('button');
            libre.className = 'prop';
            libre.innerHTML = '<span class="lib">➕ Créer « ' +
                              (champ.value.trim() || 'un aliment' ) + ' »</span>';
            libre.onclick = () => detailAliment(
                { n: champ.value.trim(), p: 100, k: 400, q: 1 }, 'encas', null);
            zone.appendChild(libre);

            majEmojis();
        }

        champ.addEventListener('input', proposer);
        proposer();

        bouton(corps, 'Annuler', 'annuler', fermerFeuille);
    });
}

/* moment : moment proposé. position : {cle, index} si modification, sinon null. */
function detailAliment(article, moment, position) {
    fermerFeuille();
    ouvrirFeuille(position ? 'Modifier l\u2019aliment' : 'Ajouter un aliment', corps => {
        corps.innerHTML =
            '<label for="a-nom">Nom</label>' +
            '<input type="text" id="a-nom">' +
            '<label for="a-moment">Repas</label>' +
            '<select id="a-moment"></select>' +
            '<label for="a-poids">Poids d\u2019une unité (g)</label>' +
            '<input type="number" id="a-poids" inputmode="numeric">' +
            '<label for="a-kcal">Calories d\u2019une unité (kcal)</label>' +
            '<input type="number" id="a-kcal" inputmode="numeric">' +
            '<label for="a-qte">Quantité</label>' +
            '<input type="number" id="a-qte" inputmode="numeric">';

        const champNom = corps.querySelector('#a-nom');
        const select = corps.querySelector('#a-moment');
        const champPoids = corps.querySelector('#a-poids');
        const champKcal = corps.querySelector('#a-kcal');
        const champQte = corps.querySelector('#a-qte');

        MOMENTS.forEach(m => {
            const o = document.createElement('option');
            o.value = m.cle; o.textContent = m.nom;
            select.appendChild(o);
        });

        champNom.value = article.n;
        select.value = position ? position.cle : moment;
        champPoids.value = article.p;
        champKcal.value = article.k;
        champQte.value = article.q;

        bouton(corps, '😀 Choisir un symbole', '', () => {
            const enCours = {
                n: champNom.value, p: +champPoids.value,
                k: +champKcal.value, q: +champQte.value
            };
            choisirEmoji(emoji => {
                enCours.n = (emoji + ' ' + enCours.n.replace(/^\S+\s/, '')).trim();
                detailAliment(enCours, select.value, position);
            }, () => detailAliment(enCours, select.value, position));
        });

        bouton(corps, position ? 'Enregistrer' : 'Ajouter', 'principal', () => {
            const nom = champNom.value.trim();
            const p = parseInt(champPoids.value, 10);
            const k = parseInt(champKcal.value, 10);
            const q = parseInt(champQte.value, 10);
            if (!nom) { toast('Donne un nom à l\u2019aliment'); return; }
            if (isNaN(p) || p < 0) { toast('Poids invalide'); return; }
            if (isNaN(k) || k < 0) { toast('Calories invalides'); return; }
            if (isNaN(q) || q < 1) { toast('Quantité invalide'); return; }

            if (position) supprimerAliment(position.cle, position.index);
            const cible = select.value;
            if (!vivres[cible]) vivres[cible] = [];
            vivres[cible].push({ n: nom, p: p, k: k, q: q });

            sauver(); afficher(); fermerFeuille();
            toast(position ? 'Aliment modifié' : '« ' + nom + ' » ajouté');
        });

        bouton(corps, 'Annuler', 'annuler', fermerFeuille);
    });
}

function supprimerAliment(cle, index) {
    if (vivres[cle]) vivres[cle].splice(index, 1);
}

function menuAliment(cle, index) {
    const article = vivres[cle][index];
    ouvrirFeuille(article.n, corps => {
        bouton(corps, '✏️ Modifier', '', () => {
            detailAliment(Object.assign({}, article), cle, { cle: cle, index: index });
        });
        bouton(corps, '🗑️ Supprimer', 'danger', () => {
            fermerFeuille();
            supprimerAliment(cle, index);
            sauver(); afficher();
            toast('Aliment supprimé');
        });
        bouton(corps, 'Annuler', 'annuler', fermerFeuille);
    });
}

/* ---------------------------------------------------------------- Symboles */

function choisirEmoji(rappel, retour) {
    fermerFeuille();
    ouvrirFeuille('Choisir un symbole', corps => {
        for (const theme in THEMES_EMOJI) {
            const titre = document.createElement('div');
            titre.className = 'titre-theme';
            titre.textContent = theme;
            corps.appendChild(titre);

            const grille = document.createElement('div');
            grille.className = 'grille-emoji';
            THEMES_EMOJI[theme].forEach(emoji => {
                const b = document.createElement('button');
                b.textContent = emoji;
                b.onclick = () => { fermerFeuille(); rappel(emoji); };
                grille.appendChild(b);
            });
            corps.appendChild(grille);
        }
        bouton(corps, 'Retour', 'annuler', () => { fermerFeuille(); if (retour) retour(); });
        majEmojis();
    });
}

/* ---------------------------------------------------------------- Courses */

function listeDeCourses() {
    const cumul = {};
    MOMENTS.forEach(m => (vivres[m.cle] || []).forEach(a => {
        if (!cumul[a.n]) cumul[a.n] = { q: 0, masse: 0, kcal: 0 };
        cumul[a.n].q += a.q;
        cumul[a.n].masse += a.p * a.q;
        cumul[a.n].kcal += a.k * a.q;
    }));
    return cumul;
}

function ouvrirCourses() {
    const cumul = listeDeCourses();
    const noms = Object.keys(cumul).sort((a, b) => a.localeCompare(b, 'fr'));

    if (!noms.length) { toast('Ta liste de vivres est vide'); return; }

    const b = bilanVivres();
    let texte = 'Mon sac à dos — liste de courses\n' +
                reglages.jours + ' jours · ' + formaterEntier(reglages.kcalJour) + ' kcal/jour\n\n';
    noms.forEach(n => {
        texte += cumul[n].q + ' × ' + n + '  (' + formaterMasse(cumul[n].masse) + ')\n';
    });
    texte += '\nTotal : ' + formaterMasse(b.masse) + ' · ' + formaterEntier(b.kcal) + ' kcal';

    ouvrirFeuille('Liste de courses', corps => {
        const bloc = document.createElement('div');
        bloc.className = 'courses';
        let html = '<h4>' + reglages.jours + ' jours · ' + formaterEntier(reglages.kcalJour) + ' kcal/jour</h4>';
        noms.forEach(n => {
            html += '<div><span>' + cumul[n].q + ' × ' + n + '</span><span>' +
                    formaterMasse(cumul[n].masse) + '</span></div>';
        });
        html += '<h4>Total</h4><div><span>' + formaterMasse(b.masse) + '</span><span>' +
                formaterEntier(b.kcal) + ' kcal</span></div>';
        bloc.innerHTML = html;
        corps.appendChild(bloc);

        bouton(corps, '📋 Copier la liste', 'principal', () => {
            copierTexte(texte);
        });
        bouton(corps, 'Fermer', 'annuler', fermerFeuille);
        majEmojis();
    });
}

function copierTexte(texte) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texte)
            .then(() => toast('Liste copiée'))
            .catch(() => copierRepli(texte));
    } else {
        copierRepli(texte);
    }
}

function copierRepli(texte) {
    const zone = document.createElement('textarea');
    zone.value = texte;
    zone.style.position = 'fixed';
    zone.style.opacity = '0';
    document.body.appendChild(zone);
    zone.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(zone);
    toast(ok ? 'Liste copiée' : 'Copie impossible sur cet appareil');
}

/* ---------------------------------------------------------------- Bascule */

function majBoutonVue() {
    const btn = document.getElementById('btn-vue');
    btn.textContent = (vue === 'sac') ? '🍲' : '🎒';
    btn.setAttribute('aria-label', vue === 'sac' ? 'Voir la nourriture' : 'Voir le sac');
    document.querySelector('.entete-haut h1').textContent =
        (vue === 'sac') ? 'Mon sac à dos' : '🍲 Nourriture';
    document.getElementById('hero-sac').hidden = (vue !== 'sac');
    document.getElementById('barre-sac').hidden = (vue !== 'sac');
    document.getElementById('entete-food').hidden = (vue !== 'food');
}

function basculerVue() {
    vue = (vue === 'sac') ? 'food' : 'sac';
    majBoutonVue();
    afficher();
    window.scrollTo(0, 0);
    if (vue === 'food' && !tutoDejaVu('food')) ouvrirTuto('food');
}

document.getElementById('btn-vue').onclick = basculerVue;

const voileTuto = document.getElementById('tuto');
let tutoCourant = 'sac';

function construireTuto(cle) {
    const t = TUTOS[cle];
    tutoCourant = cle;
    document.getElementById('tuto-titre').textContent = t.titre;
    document.getElementById('tuto-intro').textContent = t.intro;

    const corps = document.getElementById('tuto-corps');
    corps.innerHTML = t.etapes.map(e =>
        '<div class="etape"><div class="sym ' + e[1] + '">' + e[0] + '</div>' +
        '<div><strong>' + e[2] + '</strong><p>' + e[3] + '</p></div></div>'
    ).join('') + '<div class="tuto-note">' + t.note + '</div>';
}

function ouvrirTuto(cle) {
    construireTuto(cle || (vue === 'food' ? 'food' : 'sac'));
    voileTuto.classList.add('ouvert');

    const carte = voileTuto.querySelector('.tuto-carte');
    const corps = voileTuto.querySelector('.tuto-corps');
    corps.scrollTop = 0;
    /* Le dégradé n'apparaît que si le contenu dépasse réellement. La lecture de
       scrollHeight force le calcul de la mise en page : pas besoin d'attendre
       une frame, qui ne viendrait pas si l'application est en arrière-plan. */
    carte.classList.toggle('defilable', corps.scrollHeight > corps.clientHeight + 1);
    majEmojis();
}

function fermerTuto() {
    voileTuto.classList.remove('ouvert');
    try { localStorage.setItem(TUTOS[tutoCourant].cle, '1'); } catch (e) {}
}

document.getElementById('tuto-ok').onclick = fermerTuto;
voileTuto.addEventListener('click', e => { if (e.target === voileTuto) fermerTuto(); });

function tutoDejaVu(cle) {
    try { return localStorage.getItem(TUTOS[cle].cle) === '1'; } catch (e) { return true; }
}

    const b = e.target.closest('button');

majBoutonVue();
afficher();

if (!tutoDejaVu('sac')) ouvrirTuto('sac');
